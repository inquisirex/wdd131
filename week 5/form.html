<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This is the WDD 131 Product Review form page. Please submit your feedback on our products using this responsive form. Your input helps us improve our offerings. Thank you for taking the time to share your thoughts with us.">  
    <meta name="author" content="Rodolfo Velasco">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <label>Overall Rating <span class="required">*</span></label>
            <div class="rating">
                <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars"></label>
                <input type="radio" id="star4" name="rating" value="4" required><label for="star4" title="4 stars"></label>
                <input type="radio" id="star3" name="rating" value="3" required><label for="star3" title="3 stars"></label>
                <input type="radio" id="star2" name="rating" value="2" required><label for="star2" title="2 stars"></label>
                <input type="radio" id="star1" name="rating" value="1" required><label for="star1" title="1 star"></label>
            </div>

            <label for="installationDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installationDate" name="installationDate" required>

            <label>Which features did you find useful in the product? <br><em>(Check all that apply)</em></label>
            <div class="checkbox-group">
                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label><br>
                
                <input type="checkbox" id="ease" name="features" value="ease">
                <label for="ease">Ease of Use</label><br>
                
                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label><br>
                
                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </div>
            <br>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <button type="submit">Post Review</button>

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Rodolfo Velasco</p>
        <p>Mexico</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
